<!DOCTYPE html>
<html lang="en">
<head>

    <title>情侣飞行棋</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #1d4f3c 0%, #357a5c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 10px;
        }

        .game-container {
            width: 100%;
            max-width: 1350px;
            background: #fbefd7;
            border-radius: clamp(30px, 6vw, 90px);
            box-shadow: 0 30px 45px rgba(0,0,0,0.7), inset 4px 4px 15px #fff4d2;
            padding: clamp(15px, 3vw, 40px);
            border: clamp(3px, 0.6vw, 8px) solid #efc58b;
        }

        /* 头部 */
        .header {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(10px, 2vw, 25px);
            justify-content: space-between;
            align-items: center;
            background: #fff3d9;
            padding: clamp(12px, 2.5vw, 22px) clamp(20px, 4vw, 40px);
            border-radius: clamp(40px, 8vw, 100px);
            margin-bottom: clamp(15px, 3vw, 35px);
            border: clamp(3px, 0.5vw, 5px) solid #d6a567;
        }

        .player-box {
            display: flex;
            gap: clamp(15px, 3vw, 45px);
            background: #ffefce;
            padding: clamp(10px, 2vw, 18px) clamp(20px, 4vw, 40px);
            border-radius: clamp(40px, 7vw, 90px);
            flex-wrap: wrap;
        }

        .player-item {
            display: flex;
            align-items: center;
            gap: clamp(8px, 1.5vw, 18px);
            font-size: clamp(1.2rem, 2.5vw, 2rem);
        }

        .player-item span {
            font-size: clamp(1.5rem, 3vw, 2.5rem);
        }

        .player-item input {
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            width: clamp(100px, 20vw, 170px);
            padding: clamp(5px, 1vw, 10px) clamp(10px, 2vw, 20px);
            border-radius: clamp(30px, 6vw, 70px);
            border: 3px solid #b87f41;
            background: #fffcf0;
            text-align: center;
            font-weight: 600;
        }

        .dice-block {
            display: flex;
            align-items: center;
            gap: clamp(15px, 3vw, 30px);
            background: #ffefce;
            padding: clamp(8px, 1.5vw, 12px) clamp(20px, 4vw, 40px);
            border-radius: clamp(40px, 7vw, 90px);
        }

        .dice-box {
            width: clamp(60px, 10vw, 110px);
            height: clamp(60px, 10vw, 110px);
            background: white;
            border-radius: clamp(15px, 3vw, 35px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2.8rem, 6vw, 5.5rem);
            font-weight: bold;
            box-shadow: inset 0 -5px 5px rgba(0,0,0,0.1), 0 clamp(6px, 1.5vw, 14px) 0 #9e632e;
            border: clamp(2px, 0.5vw, 5px) solid #71491e;
            color: #2b1c0b;
        }

        .dice-box.rolling {
            animation: shake 0.15s infinite;
        }

        @keyframes shake {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(14deg) scale(1.1); }
            50% { transform: rotate(-14deg) scale(1.1); }
            75% { transform: rotate(8deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }

        /* 棋盘 - 完全自适应 */
        .board {
            background: #dfb77e;
            padding: clamp(15px, 3vw, 40px);
            border-radius: clamp(40px, 8vw, 100px);
            border: clamp(4px, 0.8vw, 8px) solid #ad763b;
            box-shadow: inset 0 0 0 clamp(5px, 1vw, 12px) #f7dcb1;
            margin-bottom: clamp(15px, 3vw, 35px);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .track {
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.5vw, 18px);
            min-width: min-content;
        }

        .grid-row {
            display: flex;
            justify-content: center;
            gap: clamp(8px, 1.5vw, 18px);
        }

        .cell {
            width: clamp(60px, 10vw, 110px);
            height: clamp(60px, 10vw, 110px);
            background: #fff7e6;
            border-radius: clamp(10px, 2vw, 22px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 2vw, 1.8rem);
            font-weight: 600;
            color: #4f351e;
            box-shadow: inset 0 clamp(-4px, -0.8vw, -7px) 0 #c9a875, 0 clamp(4px, 0.8vw, 9px) 0 #7e592e;
            border: clamp(2px, 0.4vw, 4px) solid #c08b4a;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }

        .cell.start {
            background: #b3e0b0;
            box-shadow: inset 0 clamp(-4px, -0.8vw, -7px) 0 #7bb07b, 0 clamp(4px, 0.8vw, 9px) 0 #3b7a3b;
            border-color: #2f8230;
        }

        .cell.finish {
            background: #f8dba8;
            box-shadow: inset 0 clamp(-4px, -0.8vw, -7px) 0 #dcb067, 0 clamp(4px, 0.8vw, 9px) 0 #b4722c;
            border-color: #cd7d2a;
        }

        /* 棋子 - 完全自适应 */
        .piece {
            width: clamp(45px, 7vw, 85px);
            height: clamp(45px, 7vw, 85px);
            border-radius: 50%;
            border: clamp(2px, 0.5vw, 5px) solid white;
            box-shadow: 0 clamp(4px, 0.8vw, 8px) clamp(6px, 1vw, 12px) black;
            font-size: clamp(0.9rem, 1.8vw, 1.8rem);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #333;
            color: white;
            font-weight: bold;
            z-index: 10;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-shadow: 1px 1px 2px black;
            word-break: break-word;
            text-align: center;
            line-height: 1.2;
            padding: 0 3px;
            transition: left 0.6s cubic-bezier(0.25, 0.1, 0.15, 1.2), top 0.6s cubic-bezier(0.25, 0.1, 0.15, 1.2);
        }

        .piece.p1 { background: #d32f2f; }
        .piece.p2 { background: #1976d2; }

        /* 任务弹窗 - 手机优化 */
        .task-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.4s ease, visibility 0.4s;
            padding: 15px;
        }

        .task-modal.show {
            visibility: visible;
            opacity: 1;
        }

        .task-card {
            background: #fff8e7;
            max-width: 700px;
            width: 100%;
            padding: clamp(20px, 5vw, 50px);
            border-radius: clamp(40px, 10vw, 120px);
            border: clamp(5px, 1vw, 10px) solid #e6aa6a;
            box-shadow: 0 20px 40px black;
            text-align: center;
            transform: scale(0.7);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .task-modal.show .task-card {
            transform: scale(1);
        }

        .task-card h2 {
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            color: #a5531b;
            margin-bottom: clamp(15px, 3vw, 30px);
        }

        .task-content {
            font-size: clamp(1.4rem, 4vw, 2.8rem);
            background: #ffd9a8;
            padding: clamp(20px, 6vw, 60px) clamp(15px, 4vw, 30px);
            border-radius: clamp(40px, 8vw, 90px);
            margin: clamp(15px, 3vw, 30px) 0;
            border: clamp(3px, 0.8vw, 6px) solid #c98342;
            min-height: clamp(150px, 30vw, 280px);
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }

        .close-task {
            background: #f7b731;
            border: none;
            font-size: clamp(1.6rem, 4vw, 3rem);
            padding: clamp(10px, 3vw, 20px) clamp(30px, 8vw, 70px);
            border-radius: clamp(40px, 8vw, 90px);
            font-weight: bold;
            color: #3b280f;
            border-bottom: clamp(4px, 1vw, 10px) solid #a4681a;
            cursor: pointer;
            transition: 0.05s linear;
            margin-top: 10px;
            width: 100%;
        }

        .close-task:active { transform: translateY(5px); border-bottom-width: 3px; }

        /* 控制区 - 手机优化 */
        .controls {
            display: flex;
            gap: clamp(10px, 2vw, 35px);
            justify-content: center;
            margin: clamp(15px, 3vw, 35px) 0 clamp(10px, 2vw, 25px);
            flex-wrap: wrap;
        }

        .ctrl-btn {
            background: #ffb882;
            border: clamp(3px, 0.7vw, 7px) solid #8b5a2b;
            color: #36200c;
            font-size: clamp(1.4rem, 3vw, 2.6rem);
            font-weight: bold;
            padding: clamp(8px, 2vw, 18px) clamp(20px, 5vw, 65px);
            border-radius: clamp(40px, 8vw, 100px);
            cursor: pointer;
            box-shadow: 0 clamp(5px, 1.2vw, 12px) 0 #6b3f20;
            transition: 0.05s linear;
            flex: 0 1 auto;
        }

        .ctrl-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #6b3f20; }

        .footer-info {
            display: flex;
            justify-content: space-between;
            color: #4a311b;
            font-size: clamp(1.2rem, 2.5vw, 2.2rem);
            background: #eedbba;
            padding: clamp(8px, 2vw, 18px) clamp(15px, 3vw, 40px);
            border-radius: clamp(40px, 7vw, 90px);
            border: clamp(2px, 0.5vw, 5px) solid #b6834c;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* 任务仓库 - 手机优化 */
        .task-repo {
            background: #ecd9b5;
            border-radius: clamp(40px, 8vw, 90px);
            padding: clamp(15px, 3vw, 35px);
            margin-top: 20px;
            border: clamp(3px, 0.8vw, 7px) solid #b27d45;
        }

        .repo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: clamp(10px, 2vw, 25px);
        }

        .repo-header h3 {
            font-size: clamp(1.4rem, 3vw, 2.6rem);
            color: #533b1f;
        }

        .add-task-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .add-task-form input {
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            padding: clamp(8px, 1.5vw, 14px) clamp(15px, 3vw, 32px);
            border-radius: clamp(40px, 7vw, 80px);
            border: 3px solid #a57238;
            width: clamp(200px, 40vw, 380px);
            background: #fffcf0;
        }

        .add-task-form button {
            background: #719f4a;
            border: none;
            padding: clamp(8px, 1.5vw, 14px) clamp(20px, 4vw, 45px);
            border-radius: clamp(40px, 7vw, 80px);
            font-size: clamp(1.2rem, 2.5vw, 2.2rem);
            font-weight: bold;
            color: white;
            border-bottom: clamp(4px, 0.8vw, 8px) solid #42632c;
            cursor: pointer;
        }

        .task-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            max-height: clamp(150px, 25vw, 260px);
            overflow-y: auto;
            padding: clamp(10px, 2vw, 25px);
            background: #fff1d2;
            border-radius: clamp(40px, 7vw, 80px);
            border: 3px solid #b57847;
            flex-direction: row-reverse;
            justify-content: flex-end;
        }

        .task-chip {
            background: #ffdfa3;
            padding: clamp(6px, 1.2vw, 14px) clamp(12px, 2.5vw, 32px);
            border-radius: 60px;
            font-size: clamp(1rem, 2vw, 1.9rem);
            border: 2px solid #a57035;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 3px 0 #8b6130;
        }

        .task-chip .remove-task {
            background: #d65757;
            border: none;
            color: white;
            border-radius: 50%;
            width: clamp(24px, 4vw, 42px);
            height: clamp(24px, 4vw, 42px);
            font-size: clamp(1.2rem, 2.5vw, 2.2rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 3px solid #913e3e;
        }
    </style>
</head>

        const winnerMsg = document.getElementById('winnerMsg');
        const playerFooter = document.getElementById('playerFooter');
        const rollBtn = document.getElementById('rollDiceBtn');
        const resetBtn = document.getElementById('resetBtn');
        const taskModal = document.getElementById('taskModal');
        const taskTitle = document.getElementById('taskTitle');
        const taskTextEl = document.getElementById('taskText');
        const closeTaskBtn = document.getElementById('closeTaskBtn');
        const taskListContainer = document.getElementById('taskListContainer');
        const newTaskInput = document.getElementById('newTaskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const player1Input = document.getElementById('player1Name');
        const player2Input = document.getElementById('player2Name');

        // 初始化任务库 - 智能合并：保留用户自定义，仅添加默认任务中不重复的新任务
        function initializeTaskLibrary() {
            const stored = localStorage.getItem(STORAGE_KEY);
            
            if (stored) {
                try {
                    // 加载用户已有的任务库（包含所有自定义任务）
                    taskLibrary = JSON.parse(stored);
                    // 确保是数组
                    if (!Array.isArray(taskLibrary)) {
                        taskLibrary = [...DEFAULT_TASKS];
                    }
                } catch {
                    // 解析失败，使用默认任务
                    taskLibrary = [...DEFAULT_TASKS];
                }
            } else {
                // 首次运行，使用默认任务
                taskLibrary = [...DEFAULT_TASKS];
            }
            
            // 智能合并：只添加默认任务中不存在的新任务，绝不删除用户自定义的任务
            mergeNewDefaultTasks();
            
            // 保存合并后的任务库
            saveTaskLibrary();
            
            renderTaskList();
        }

        // 智能合并：只添加默认任务中不存在的新任务，保留所有用户自定义任务
        function mergeNewDefaultTasks() {
            let needsSave = false;
            
            // 遍历默认任务（从后往前，保持添加顺序）
            for (let i = DEFAULT_TASKS.length - 1; i >= 0; i--) {
                const defaultTask = DEFAULT_TASKS[i];
                
                // 检查任务库中是否已经存在这个任务（精确匹配）
                // 注意：这里使用严格匹配，如果用户添加了类似但不同的任务，不会被覆盖
                if (!taskLibrary.includes(defaultTask)) {
                    // 将新默认任务添加到头部
                    taskLibrary.unshift(defaultTask);
                    needsSave = true;
                }
            }
            
            // 注意：我们绝不删除任何用户自定义的任务，即使它们不在默认任务列表中
            
            if (needsSave) {
                console.log('检测到新的默认任务，已添加到仓库头部');
            }
        }

        function saveTaskLibrary() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(taskLibrary));
        }

        function renderTaskList() {
            taskListContainer.innerHTML = '';
            const reversedLibrary = [...taskLibrary].reverse();
            reversedLibrary.forEach((task, i) => {
                const originalIndex = taskLibrary.length - 1 - i;
                const chip = document.createElement('div');
                chip.className = 'task-chip';
                chip.innerHTML = `<span>${task}</span><button class="remove-task" data-index="${originalIndex}">✖</button>`;
                taskListContainer.appendChild(chip);
            });
            document.querySelectorAll('.remove-task').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeTask(parseInt(btn.dataset.index));
                });
            });
        }

        function addTask(newTask) {
            if (newTask.trim() === '') return;
            taskLibrary.unshift(newTask.trim());
            saveTaskLibrary();
            renderTaskList();
        }

        function removeTask(index) {
            if (index >= 0 && index < taskLibrary.length) {
                taskLibrary.splice(index, 1);
                saveTaskLibrary();
                renderTaskList();
            }
        }

        // 强制43个格子有任务
        function assignTasksToGrid() {
            const tasks = new Array(GRID_COUNT).fill(null);
            tasks[0] = null;
            tasks[GRID_COUNT-1] = null;

            const middleIndices = [];
            for (let i = 1; i <= 48; i++) middleIndices.push(i);

            for (let i = middleIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [middleIndices[i], middleIndices[j]] = [middleIndices[j], middleIndices[i]];
            }

            for (let k = 0; k < 43; k++) {
                const idx = middleIndices[k];
                if (taskLibrary.length > 0) {
                    const rand = Math.floor(Math.random() * taskLibrary.length);
                    tasks[idx] = taskLibrary[rand];
                } else {
                    tasks[idx] = "默认任务: 做点有趣的事";
                }
            }
            return tasks;
        }

        function renderBoard() {
            trackContainer.innerHTML = '';
            for (let r = 0; r < 5; r++) {
                const row = document.createElement('div');
                row.className = 'grid-row';
                for (let c = 0; c < 10; c++) {
                    const index = r * 10 + c;
                    row.appendChild(createCellElement(index));
                }
                trackContainer.appendChild(row);
            }
            placePieces();
            updateFooterNames();
        }

        function createCellElement(index) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.index = index;

            if (index === 0) {
                cell.classList.add('start');
                const startSpan = document.createElement('span');
                startSpan.textContent = '开始';
                startSpan.style.fontSize = 'clamp(1rem, 2vw, 1.8rem)';
                startSpan.style.fontWeight = 'bold';
                cell.appendChild(startSpan);
            } else if (index === GRID_COUNT-1) {
                cell.classList.add('finish');
                const finishSpan = document.createElement('span');
                finishSpan.textContent = '终点';
                finishSpan.style.fontSize = 'clamp(1rem, 2vw, 1.8rem)';
                finishSpan.style.fontWeight = 'bold';
                cell.appendChild(finishSpan);
            } else {
                const numSpan = document.createElement('span');
                numSpan.style.position = 'absolute';
                numSpan.style.top = '3px';
                numSpan.style.left = '5px';
                numSpan.style.fontSize = 'clamp(0.8rem, 1.5vw, 1.4rem)';
                numSpan.style.opacity = '0.5';
                numSpan.textContent = index + 1;
                cell.appendChild(numSpan);
            }

            cell.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(cell.dataset.index);
                const task = gridTasks[idx];
                if (task) {
                    // 手动点击格子查看任务，但不影响游戏流程
                    taskTitle.textContent = `✨ 格子 ${idx+1} 的任务 ✨`;
                    taskTextEl.textContent = task;
                    taskModal.classList.add('show');
                    isTaskModalOpen = true;
                    // 手动查看时不清空自动关闭定时器，但不影响
                } else {
                    alert(`格子 ${idx+1} 无任务`);
                }
            });
            return cell;
        }

        function placePieces() {
            document.querySelectorAll('.piece').forEach(p => p.remove());

            if (!players[0].finished) {
                const cell1 = document.querySelector(`.cell[data-index="${players[0].pos}"]`);
                if (cell1) {
                    const piece1 = document.createElement('div');
                    piece1.className = 'piece p1';
                    piece1.dataset.player = '0';
                    piece1.textContent = player1Input.value.trim() || '妹妹';
                    cell1.style.position = 'relative';
                    cell1.appendChild(piece1);
                }
            }

            if (!players[1].finished) {
                const cell2 = document.querySelector(`.cell[data-index="${players[1].pos}"]`);
                if (cell2) {
                    const piece2 = document.createElement('div');
                    piece2.className = 'piece p2';
                    piece2.dataset.player = '1';
                    piece2.textContent = player2Input.value.trim() || '哥哥';
                    if (players[0].pos === players[1].pos && !players[0].finished && !players[1].finished) {
                        piece2.style.transform = 'translate(-30%, -30%)';
                        const p1 = cell2.querySelector('.piece.p1');
                        if (p1) p1.style.transform = 'translate(-70%, -70%)';
                    }
                    cell2.style.position = 'relative';
                    cell2.appendChild(piece2);
                }
            }

            checkWinner();
        }

        async function animateMove(startPos, steps) {
            return new Promise((resolve) => {
                let step = 0;
                const totalSteps = steps;
                const interval = setInterval(() => {
                    if (step >= totalSteps) {
                        clearInterval(interval);
                        resolve();
                        return;
                    }
                    step++;
                    const newPos = Math.min(startPos + step, GRID_COUNT - 1);
                    players[currentPlayer].pos = newPos;
                    placePieces();

                    if (newPos === GRID_COUNT - 1) {
                        clearInterval(interval);
                        resolve();
                    }
                }, 280);
            });
        }

        function rollDice() {
            if (rolling || isMoving) return;
            if (players[0].finished || players[1].finished) { alert('游戏已结束，重新开始吧'); return; }

            rolling = true;
            diceEl.classList.add('rolling');
            const rollInterval = setInterval(() => {
                const fake = Math.floor(Math.random() * 6) + 1;
                updateDiceFace(fake);
            }, 80);

            setTimeout(() => {
                clearInterval(rollInterval);
                diceEl.classList.remove('rolling');
                diceValue = Math.floor(Math.random() * 6) + 1;
                updateDiceFace(diceValue);
                rolling = false;
                moveCurrentPlayerWithAnimation();
            }, 2000);
        }

        function updateDiceFace(val) {
            const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
            diceEl.textContent = faces[val-1];
        }

        async function moveCurrentPlayerWithAnimation() {
            if (isMoving) return;
            isMoving = true;

            const player = players[currentPlayer];
            if (player.finished) {
                isMoving = false;
                nextTurn();
                return;
            }

            const startPos = player.pos;
            const steps = Math.min(diceValue, GRID_COUNT - 1 - startPos);
            if (steps <= 0) {
                isMoving = false;
                nextTurn();
                return;
            }

            await animateMove(startPos, steps);

            if (player.pos === GRID_COUNT - 1) {
                player.finished = true;
                winnerMsg.innerText = `🏆 ${getPlayerName(currentPlayer)} 获胜！ 🏆`;
                placePieces();
                isMoving = false;
                return;
            }

            placePieces();
            const task = gridTasks[player.pos];
            showTaskWithOpponentName(player.pos, task);
            isMoving = false;
        }

        function getOpponentName() {
            return currentPlayer === 0 ? (player2Input.value.trim() || '哥哥') : (player1Input.value.trim() || '妹妹');
        }

        function showTaskWithOpponentName(gridIndex, task) {
            if (isTaskModalOpen) {
                closeTaskImmediately();
            }
            const opponent = getOpponentName();
            const isEmpty = (task === null || task === undefined);
            currentTaskIsEmpty = isEmpty;

            if (!isEmpty) {
                taskTitle.textContent = `✨ ${opponent} 的任务 ✨`;
                taskTextEl.textContent = task;
                if (autoCloseTimer) clearTimeout(autoCloseTimer);
            } else {
                taskTitle.textContent = `✨ 恭喜 ${opponent} ✨`;
                taskTextEl.textContent = `恭喜 ${opponent} 逃过一个任务！`;
                if (autoCloseTimer) clearTimeout(autoCloseTimer);
                autoCloseTimer = setTimeout(() => {
                    if (isTaskModalOpen && currentTaskIsEmpty) {
                        closeTaskImmediately();
                        nextTurn();
                    }
                }, 1500);
            }

            taskModal.classList.add('show');
            isTaskModalOpen = true;
        }

        function closeTaskImmediately() {
            taskModal.classList.remove('show');
            isTaskModalOpen = false;
            if (autoCloseTimer) {
                clearTimeout(autoCloseTimer);
                autoCloseTimer = null;
            }
        }

        function closeTaskManually() {
            if (!isTaskModalOpen) return;
            if (!currentTaskIsEmpty) {
                closeTaskImmediately();
                nextTurn();
            } else {
                closeTaskImmediately();
                nextTurn();
            }
        }

        function nextTurn() {
            if (players[0].finished || players[1].finished) return;
            currentPlayer = currentPlayer === 0 ? 1 : 0;
        }

        function getPlayerName(idx) {
            return idx === 0 ? (player1Input.value.trim() || '妹妹') : (player2Input.value.trim() || '哥哥');
        }

        function updateFooterNames() {
            playerFooter.innerText = `👧 ${player1Input.value || '妹妹'}  👦 ${player2Input.value || '哥哥'}`;
        }

        function checkWinner() {
            if (players[0].finished) winnerMsg.innerText = `🏆 ${player1Input.value || '妹妹'} 获胜！ 🏆`;
            else if (players[1].finished) winnerMsg.innerText = `🏆 ${player2Input.value || '哥哥'} 获胜！ 🏆`;
            else winnerMsg.innerText = '先到终点者赢';
        }

        function resetGame() {
            clearInterval(timer); rolling = false; isMoving = false; diceEl.classList.remove('rolling');
            if (autoCloseTimer) clearTimeout(autoCloseTimer);
            closeTaskImmediately();
            players = [ { pos: 0, finished: false }, { pos: 0, finished: false } ];
            currentPlayer = 0;
            diceValue = 1;
            updateDiceFace(1);
            gridTasks = assignTasksToGrid();
            renderBoard();
            winnerMsg.innerText = '先到终点者赢';
            updateFooterNames();
        }

        rollBtn.addEventListener('click', rollDice);
        resetBtn.addEventListener('click', resetGame);
        closeTaskBtn.addEventListener('click', closeTaskManually);
        taskModal.addEventListener('click', (e) => {
            if (e.target === taskModal) {
                closeTaskManually();
            }
        });
        addTaskBtn.addEventListener('click', () => { addTask(newTaskInput.value); newTaskInput.value = ''; });
        newTaskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { addTask(newTaskInput.value); newTaskInput.value = ''; } });
        player1Input.addEventListener('input', () => { updateFooterNames(); checkWinner(); placePieces(); });
        player2Input.addEventListener('input', () => { updateFooterNames(); checkWinner(); placePieces(); });

        // 初始化任务库（智能合并，保留用户自定义）
        initializeTaskLibrary();
        
        // 分配格子任务
        gridTasks = assignTasksToGrid();
        renderBoard();
        updateFooterNames();
    })();
</script>
</body>
</html>
